name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: '33.0.2'
          components: |
            platform-tools
            build-tools;33.0.2
            platforms;android-33

      - name: Accept Android SDK licenses
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ -x "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDKROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDKROOT/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          else
            echo "sdkmanager не найден — пропускаю принятие лицензий"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KyrgyzFlashcards-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
